# M2-A readiness configuration for the real, committed GBIF/ALA occurrence
# data (DesignSuggestionLog.md "2026-09-08 Australia/Sydney - Suggested next
# increment: M2-A authorised occurrence preparation and readiness run",
# "Required implementation order" step 7).
#
# This file is a data-preparation and readiness-assessment configuration
# only. It does not calibrate or evaluate anything. The `authorisation` block
# records the explicit project-owner approval supplied on 8 September 2026;
# it does not infer approval from public availability.
#
# Reproduce the inputs this file points at from repo root:
#
#   python scripts/prepare_m2_occurrence_table.py \
#     --output-csv data/local/m2/conversion/m2_occurrences.csv \
#     --output-report data/local/m2/conversion/m2_conversion_report.json
#
#   python -m s3_ecological.cli import-occurrences \
#     --input data/local/m2/conversion/m2_occurrences.csv \
#     --source generic_dwc \
#     --dataset-id m2-fruit-fly-occurrences-v1 \
#     --retrieved-at 2026-09-08T00:00:00Z \
#     --dataset-license "Mixed: see per-record license field (GBIF CC-BY/CC-BY-NC/CC0 legalcode URLs; ALA CC-BY/CC-BY-NC/CC0 variants) - not a single dataset-wide license" \
#     --citation "GBIF.org occurrence downloads and Atlas of Living Australia (ALA) occurrence records for Anastrepha, Bactrocera, Ceratitis, Rhagoletis, retrieved 2026-09-07, converted via scripts/prepare_m2_occurrence_table.py (m2-occurrence-conversion-v0.1)" \
#     --output-dir data/local/m2/bundle
#
#   python -m s3_ecological.cli prepare-geo-experiment \
#     --config config/geo_experiment.m2.toml \
#     --output-dir data/local/m2/readiness
#
# `data/local/` is gitignored (see .gitignore) - none of the real bundle or
# readiness output files this config produces are committed to the
# repository. Results are instead recorded in WorkLog.md and the M2 data
# card, per the explicit repository-storage decision the M2-A design entry
# requires for real spatial occurrence data.

schema_version = "1.1.0"
experiment_id = "m2-fruit-fly-occurrences-v1-readiness-2026-09-08"

generated_at = 2026-09-08T00:00:00+10:00

occurrence_snapshot_path = "data/local/m2/bundle/occurrences.json"
taxonomy_snapshot_path = "data/local/m2/bundle/taxonomy.json"
import_report_path = "data/local/m2/bundle/import-report.json"

# The four TF4 genera. Unchanged from the schema default; listed explicitly
# for clarity in this M2-specific file.
target_taxa = ["Anastrepha", "Bactrocera", "Ceratitis", "Rhagoletis"]

geographic_scope = "global"
geographic_scope_mode = "label_only"

# This is real, committed GBIF/ALA occurrence data, not a synthetic
# engineering fixture.
data_nature = "real_world_data"

# The isolated TF4 reproduction remains outside the S3 runtime. Its external
# bundle path is enabled only after the separate S1-bundle validator accepts
# hashes, split identity, taxonomy crosswalk, semantics, and leakage controls.
s1_evaluation_input_path = "data/local/m2/s1/outputs/fold-0/s1_bundle_manifest.json"

[authorisation]
# Explicit project-owner approval supplied in this task on 8 September 2026.
# Resources named in the FlyTech introduction are approved for this project's
# non-commercial research use. This declaration records project approval; it
# does not alter any third-party licence or redistribution condition.
status = "authorised"
authorisation_reference = "owner-approval-m2-2026-09-08"
purpose = "FlyTech S3 Milestone 2 fruit-fly geographic-prior reproduction, training and spatial-holdout evaluation"
approving_role = "project owner"

[spatial_split]
# Existing, uncalibrated Profile v0.1 spatial-split defaults, unchanged from
# config/geo_experiment.example.toml. These are data-preparation parameters,
# not a calibrated or biologically validated setting.
block_strategy = "latitude_longitude_grid_v0.1"
grid_size_degrees = 1.0
train_ratio = 0.60
validation_ratio = 0.20
test_ratio = 0.20
seed = 42

[settings_overrides]
